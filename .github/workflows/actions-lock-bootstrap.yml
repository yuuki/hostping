# TEMPORARY: generates .github/workflows/actions.lock with gh-actions-lock
# and prints the result as a patch in the job log, from where it is applied
# and committed to the repository's branch; and runs `make lint-actions`
# (actionlint, zizmor and `gh actions-lock --verify`, online) on the
# branches that already carry their lockfile. Removed again before the
# branch is merged.
name: actions-lock bootstrap

on:
  push:
    branches: [agent/great-wright-ex8i0g]
    paths: [.github/workflows/actions-lock-bootstrap.yml]

permissions:
  contents: read

jobs:
  # grafana-fleetgrid-panel again, with the grafana/plugin-actions references
  # that the first run turned into moving tags (wait-for-grafana/v1, ...)
  # written as the exact release tags of the same commits.
  lock:
    name: lock (grafana-fleetgrid-panel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Install gh-actions-lock
        run: go install github.com/github/gh-actions-lock/cmd/gh-actions-lock@v0.4.1

      - name: Lock
        env:
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: '1'
        run: |
          set -u
          git clone --quiet --filter=blob:none https://github.com/yuuki/grafana-fleetgrid-panel.git work
          git -C work -c advice.detachedHead=false checkout --quiet 9560c8c1c38d4c847e9fa8d1a09c849c15560d04
          cd work
          sed -i -E 's%(grafana/plugin-actions/(wait-for-grafana|create-plugin-update|is-compatible|playwright-gh-pages/upload-report-artifacts|playwright-gh-pages/deploy-report-pages))@[0-9a-f]{40} # ([a-z-]+/v[0-9]+\.[0-9]+\.[0-9]+)$%\1@\3%' .github/workflows/*.yml
          git diff --stat
          lock="$(go env GOPATH)/bin/gh-actions-lock"
          rc=0
          "$lock" --no-interactive || rc=$?
          echo "gh-actions-lock exit status: $rc"
          vrc=0
          "$lock" --verify || vrc=$?
          echo "gh-actions-lock --verify exit status: $vrc"
          zrc=0
          pipx run zizmor==1.32.0 . || zrc=$?
          echo "zizmor exit status: $zrc"
          git add -A
          git diff --cached --stat
          git diff --cached --binary > ../lock.patch
          echo "patch sha256: $(sha256sum < ../lock.patch | cut -d' ' -f1)"
          echo "BEGIN-PATCH"
          gzip -9n < ../lock.patch | base64
          echo "END-PATCH"
          exit $((rc || vrc || zrc))

  # The checks of each repository's own workflow-audit CI job, on its branch.
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: droot, repo: yuuki/droot}
          - {name: grafana-slurm-app, repo: yuuki/grafana-slurm-app}
          - {name: hostping, repo: yuuki/hostping}
          - {name: ipneigh_exporter, repo: yuuki/ipneigh_exporter}
          - {name: lustre-ebpf-exporter, repo: yuuki/lustre-ebpf-exporter}
          - {name: lustre_client_exporter, repo: yuuki/lustre_client_exporter}
          - {name: metricsifter, repo: ai4sre/metricsifter}
          - {name: mlxlink_exporter, repo: yuuki/mlxlink_exporter}
          - {name: rdma_exporter, repo: yuuki/rdma_exporter}
          - {name: rpingmesh, repo: yuuki/rpingmesh}
          - {name: shawk, repo: yuuki/shawk}
          - {name: ssh_session_exporter, repo: yuuki/ssh_session_exporter}
          - {name: tcpulse, repo: yuuki/tcpulse}
          - {name: xtsdb, repo: yuuki/xtsdb}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: make lint-actions
        env:
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: '1'
          REPO: ${{ matrix.repo }}
        run: |
          git clone --quiet --filter=blob:none --branch agent/great-wright-ex8i0g "https://github.com/${REPO}.git" work
          cd work
          git log -1 --format='%H %s'
          rm -f .github/workflows/actions-lock-bootstrap.yml
          make lint-actions
